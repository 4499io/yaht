stages:
  - test
  - deploy

# Single macOS job by design — SaaS macOS runner spin-up makes multiple jobs
# more expensive than one lean one.
#
# The job is a REAL gate (allow_failure: false): auto-merge only fires on a
# green pipeline. Docs-only MRs skip the job entirely via rules:changes — the
# project allows merging without a pipeline, so `glab mr merge` (without
# --auto-merge) merges those immediately.
test:
  stage: test
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "Yaht/**/*"
        - "YahtTests/**/*"
        - "Yaht.xcodeproj/**/*"
        - "Configuration/**/*"
        - "ci_scripts/**/*"
        - ".gitlab-ci.yml"
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
  # SaaS macOS VMs occasionally die mid-job ("remote command exited without
  # exit status") — retry infra failures once, never test failures.
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    DERIVED_DATA_PATH: "${CI_PROJECT_DIR}/.deriveddata"
  before_script:
    - xcodebuild -version
    - launchctl setenv CI true
  script:
    - >
      xcodebuild test
      -project Yaht.xcodeproj
      -scheme Yaht
      -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
      -parallel-testing-enabled NO
      -derivedDataPath "${DERIVED_DATA_PATH}"
      -resultBundlePath TestResults.xcresult
      -skipPackagePluginValidation
      -skipMacroValidation
      CODE_SIGN_IDENTITY=""
      CODE_SIGNING_REQUIRED=NO
      CODE_SIGNING_ALLOWED=NO
      COMPILER_INDEX_STORE_ENABLE=NO
      2>&1 | tee build.log
  after_script:
    - >
      xcrun xcresulttool get test-results summary
      --path TestResults.xcresult
      --compact 2>/dev/null || true
  # xcresult bundles are thousands of files — only upload when there is a
  # failure to debug. The after_script summary covers the green case.
  artifacts:
    when: on_failure
    paths:
      - build.log
      - TestResults.xcresult
    expire_in: 7 days
  # Shared cache across all branches: most branches see exactly one push, so
  # a per-branch key was always cold. Warm DerivedData cuts the build phase.
  cache:
    key: deriveddata-shared
    paths:
      - .deriveddata/
  allow_failure: false

# Manual TestFlight deploy: fire from a `main` pipeline whenever appropriate.
# Triggers the Xcode Cloud "Default" workflow (archive + sign + auto build-number + upload to
# App Store Connect) via scripts/asc — so signing/upload stay with Xcode Cloud.
# Requires CI/CD variables (Settings > CI/CD > Variables), all Protected:
#   ASC_AUTH_KEY   (File type) — contents of the App Store Connect .p8 key
#   ASC_KEY_ID     — the key ID
#   ASC_ISSUER_ID  — the issuer ID
deploy:testflight:
  stage: deploy
  tags:
    - saas-macos-medium-m1
  image: macos-26-xcode-26
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: false
  script:
    - command -v jq >/dev/null 2>&1 || brew install jq
    - python3 -m venv /tmp/ascvenv
    - /tmp/ascvenv/bin/pip install --quiet pyjwt cryptography
    - export PATH="/tmp/ascvenv/bin:$PATH"   # scripts/asc calls python3 (needs PyJWT) for JWT signing
    - ./scripts/asc trigger "$CI_COMMIT_REF_NAME"
